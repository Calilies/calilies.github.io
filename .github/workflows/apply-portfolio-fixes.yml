name: Apply portfolio fixes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-portfolio-fixes.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch portfolio
        shell: python
        run: |
          from pathlib import Path
          p = Path('portfolio.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('pics/demonology/client-work-gallery.webp?v=20260819-3', 'pics/demonology/client-work-gallery.jpg?v=20260819-4')
          p.write_text(s, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Use verified JPG for Demonology gallery"
            git pull --rebase origin main || true
            git push
          fi
