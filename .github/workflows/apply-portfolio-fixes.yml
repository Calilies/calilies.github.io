name: Apply portfolio fixes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-portfolio-fixes.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch portfolio
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('portfolio.html')
          s = p.read_text(encoding='utf-8')

          # Add the three Adidas cards directly inside the Adidas carousel.
          if '227905024792633' not in s:
              cards = '''
            <a href="https://www.roblox.com/bundles/227905024792633/adidas-Trionda-Wave-2026-Boots" target="_blank" rel="noopener" class="ugc-card">
              <div class="ugc-card-img"><img src="pics/ugc/227905024792633.png" data-rblx-id="227905024792633" data-rblx-type="bundle" alt="adidas Trionda Wave 2026 Boots"></div>
              <div class="ugc-card-info"><p class="ugc-name">adidas Trionda Wave 2026 Boots</p></div>
            </a>
            <a href="https://www.roblox.com/catalog/122279292783991/adidas-Host-Fusion-Bucket-Hat" target="_blank" rel="noopener" class="ugc-card">
              <div class="ugc-card-img"><img src="pics/ugc/122279292783991.png" data-rblx-id="122279292783991" alt="adidas Host Fusion Bucket Hat"></div>
              <div class="ugc-card-info"><p class="ugc-name">adidas Host Fusion Bucket Hat</p></div>
            </a>
            <a href="https://www.roblox.com/catalog/125241081869206/adidas-Festival-Wristband-Stack" target="_blank" rel="noopener" class="ugc-card">
              <div class="ugc-card-img"><img src="pics/ugc/125241081869206.png" data-rblx-id="125241081869206" alt="adidas Festival Wristband Stack"></div>
              <div class="ugc-card-info"><p class="ugc-name">adidas Festival Wristband Stack</p></div>
            </a>'''

              start = s.find('<div class="brand-section brand-adidas" data-ugc-brand="adidas">')
              if start == -1:
                  raise SystemExit('Adidas section not found')
              grid_start = s.find('<div class="ugc-grid">', start)
              if grid_start == -1:
                  raise SystemExit('Adidas grid not found')
              grid_end = s.find('</div>\n          <button class="slider-btn slider-btn-next"', grid_start)
              if grid_end == -1:
                  raise SystemExit('Adidas grid end not found')
              s = s[:grid_end] + cards + '\n          ' + s[grid_end:]

          # Demonology: render the actual gallery file as a normal img element.
          demon_start = s.find('<div class="assets-subpanel" id="assets-demonology">')
          if demon_start != -1:
              demon_end = s.find('</div>', demon_start)
              demon_end = s.find('</div>', demon_end + 6) + 6
              replacement = '''<div class="assets-subpanel" id="assets-demonology">
          <img class="demonology-gallery" src="pics/demonology/client-work-gallery.webp?v=20260819-2" alt="Demonology 3D asset gallery">
        </div>'''
              s = s[:demon_start] + replacement + s[demon_end:]

          p.write_text(s, encoding='utf-8')

          css = Path('portfolio.css')
          c = css.read_text(encoding='utf-8')
          if '/* Demonology img element override */' not in c:
              c += '''\n\n/* Demonology img element override */\n#assets-demonology { background: none !important; min-height: 0 !important; width: 100% !important; }\n.demonology-gallery { display:block; width:min(100%, 900px); height:auto; margin:0 auto; border-radius:20px; }\n'''
          css.write_text(c, encoding='utf-8')

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio.html portfolio.css
          if git diff --cached --quiet; then
            echo "No portfolio changes to commit."
          else
            git commit -m "Add new Adidas UGC items and render Demonology gallery"
            git pull --rebase origin main || true
            git push
          fi
