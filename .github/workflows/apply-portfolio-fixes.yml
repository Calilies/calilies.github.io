name: Apply portfolio fixes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-portfolio-fixes.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch portfolio
        shell: python
        run: |
          from pathlib import Path

          p = Path('portfolio.html')
          s = p.read_text(encoding='utf-8')

          # Remove the All button and its placeholder panel.
          s = s.replace('            <button class="assets-subtab active" data-subtab="assets-all">All</button>\n', '')
          all_panel = '        <div class="assets-subpanel active" id="assets-all">\n          <div class="port-empty"><span class="port-empty-icon">🧊</span><p>3D assets coming soon!</p></div>\n        </div>\n'
          s = s.replace(all_panel, '')

          # Make Demonology the default active client-work tab.
          s = s.replace('<button class="assets-subtab" data-subtab="assets-demonology">Demonology</button>', '<button class="assets-subtab active" data-subtab="assets-demonology">Demonology</button>', 1)

          # Replace Demonology placeholder with the real gallery image.
          old_demon = '        <div class="assets-subpanel" id="assets-demonology">\n          <div class="port-empty"><span class="port-empty-icon">🧊</span><p>Demonology assets coming soon!</p></div>\n        </div>'
          new_demon = '        <div class="assets-subpanel active" id="assets-demonology">\n          <img class="demonology-gallery" src="pics/demonology/client-work-gallery.webp?v=20260819-3" alt="Demonology 3D asset gallery">\n        </div>'
          s = s.replace(old_demon, new_demon, 1)

          # Add the three requested Adidas cards inside the Adidas UGC carousel.
          if '227905024792633' not in s:
              cards = '\n            <a href="https://www.roblox.com/bundles/227905024792633/adidas-Trionda-Wave-2026-Boots" target="_blank" rel="noopener" class="ugc-card">\n              <div class="ugc-card-img"><img src="pics/ugc/227905024792633.png" data-rblx-id="227905024792633" data-rblx-type="bundle" alt="adidas Trionda Wave 2026 Boots"></div>\n              <div class="ugc-card-info"><p class="ugc-name">adidas Trionda Wave 2026 Boots</p></div>\n            </a>\n            <a href="https://www.roblox.com/catalog/122279292783991/adidas-Host-Fusion-Bucket-Hat" target="_blank" rel="noopener" class="ugc-card">\n              <div class="ugc-card-img"><img src="pics/ugc/122279292783991.png" data-rblx-id="122279292783991" alt="adidas Host Fusion Bucket Hat"></div>\n              <div class="ugc-card-info"><p class="ugc-name">adidas Host Fusion Bucket Hat</p></div>\n            </a>\n            <a href="https://www.roblox.com/catalog/125241081869206/adidas-Festival-Wristband-Stack" target="_blank" rel="noopener" class="ugc-card">\n              <div class="ugc-card-img"><img src="pics/ugc/125241081869206.png" data-rblx-id="125241081869206" alt="adidas Festival Wristband Stack"></div>\n              <div class="ugc-card-info"><p class="ugc-name">adidas Festival Wristband Stack</p></div>\n            </a>'
              start = s.find('<div class="brand-section brand-adidas" data-ugc-brand="adidas">')
              grid_start = s.find('<div class="ugc-grid">', start)
              grid_end = s.find('</div>\n          <button class="slider-btn slider-btn-next"', grid_start)
              if start == -1 or grid_start == -1 or grid_end == -1:
                  raise SystemExit('Adidas carousel not found')
              s = s[:grid_end] + cards + '\n          ' + s[grid_end:]

          p.write_text(s, encoding='utf-8')

          css = Path('portfolio.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* Demonology img element final override */'
          if marker not in c:
              c += '\n\n' + marker + '\n#assets-demonology { background: none !important; min-height: 0 !important; width: 100% !important; }\n.demonology-gallery { display: block; width: min(100%, 900px); height: auto; margin: 0 auto; border-radius: 20px; }\n'
          css.write_text(c, encoding='utf-8')

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio.html portfolio.css
          if git diff --cached --quiet; then
            echo "No portfolio changes to commit."
          else
            git commit -m "Fix 3D client tabs, Demonology gallery, and Adidas items"
            git pull --rebase origin main || true
            git push
          fi
