name: Cache Roblox thumbnails

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cache-roblox-thumbnails.yml'
      - 'portfolio.html'

permissions:
  contents: write

jobs:
  cache-thumbnails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current Roblox thumbnails
        shell: python
        run: |
          import json
          import pathlib
          import re
          import time
          import urllib.parse
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed

          html = pathlib.Path('portfolio.html').read_text(encoding='utf-8')
          asset_ids = sorted(set(re.findall(r'data-rblx-id="(\d+)"', html)))
          bundle_ids = sorted(set(re.findall(r'data-rblx-id="(\d+)"\s+data-rblx-type="bundle"', html)))
          asset_ids = [i for i in asset_ids if i not in set(bundle_ids)]

          out_dir = pathlib.Path('pics/ugc')
          out_dir.mkdir(parents=True, exist_ok=True)
          mapping = {}

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def download(url, dest):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  dest.write_bytes(r.read())

          def batches(items, n=30):
              for i in range(0, len(items), n):
                  yield items[i:i+n]

          for batch in batches(asset_ids):
              params = urllib.parse.urlencode({
                  'assetIds': ','.join(batch),
                  'returnPolicy': 'PlaceHolder',
                  'size': '420x420',
                  'format': 'Png'
              })
              data = get_json('https://thumbnails.roblox.com/v1/assets?' + params)
              for item in data.get('data', []):
                  item_id = str(item.get('targetId'))
                  image_url = item.get('imageUrl')
                  if not image_url:
                      continue
                  dest = out_dir / f'{item_id}.png'
                  try:
                      download(image_url, dest)
                      mapping[item_id] = f'pics/ugc/{item_id}.png'
                  except Exception as e:
                      print(f'Failed asset {item_id}: {e}')
              time.sleep(0.25)

          for batch in batches(bundle_ids):
              params = urllib.parse.urlencode({
                  'bundleIds': ','.join(batch),
                  'size': '420x420',
                  'format': 'Png'
              })
              data = get_json('https://thumbnails.roblox.com/v1/bundles/thumbnails?' + params)
              for item in data.get('data', []):
                  item_id = str(item.get('targetId'))
                  image_url = item.get('imageUrl')
                  if not image_url:
                      continue
                  dest = out_dir / f'{item_id}.png'
                  try:
                      download(image_url, dest)
                      mapping[item_id] = f'pics/ugc/{item_id}.png'
                  except Exception as e:
                      print(f'Failed bundle {item_id}: {e}')
              time.sleep(0.25)

          def get_asset_details(item_id):
              url = f'https://economy.roblox.com/v2/assets/{item_id}/details'
              for attempt in range(3):
                  try:
                      data = get_json(url)
                      return item_id, {
                          'PriceInRobux': data.get('PriceInRobux'),
                          'IsForSale': bool(data.get('IsForSale')),
                          'IsPublicDomain': bool(data.get('IsPublicDomain')),
                          'Sales': data.get('Sales') or 0,
                      }
                  except Exception as e:
                      if attempt == 2:
                          print(f'Failed metadata {item_id}: {e}')
                      time.sleep(0.4 * (attempt + 1))
              return item_id, None

          prices_path = pathlib.Path('prices.json')
          prices = {}
          if prices_path.exists():
              try:
                  prices = json.loads(prices_path.read_text(encoding='utf-8'))
              except Exception as e:
                  print(f'Could not read existing prices cache: {e}')

          missing_price_ids = [item_id for item_id in asset_ids if item_id not in prices]
          print(f'Fetching {len(missing_price_ids)} missing Roblox price records.')

          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = [pool.submit(get_asset_details, item_id) for item_id in missing_price_ids]
              for future in as_completed(futures):
                  item_id, details = future.result()
                  if details is not None:
                      prices[item_id] = details

          prices_path.write_text(
              json.dumps(prices, indent=2, sort_keys=True) + '\n',
              encoding='utf-8'
          )
          print(f'Cached {len(prices)} Roblox prices.')

          pathlib.Path('thumbnails.json').write_text(
              json.dumps(mapping, indent=2, sort_keys=True) + '\n',
              encoding='utf-8'
          )
          print(f'Cached {len(mapping)} Roblox thumbnails.')

      - name: Commit cached thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pics/ugc thumbnails.json prices.json
          if git diff --cached --quiet; then
            echo "No thumbnail changes to commit."
          else
            git commit -m "Cache Roblox UGC thumbnails locally"
            git push
          fi
